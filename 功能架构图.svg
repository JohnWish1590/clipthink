<svg viewBox="0 0 680 540" width="100%" role="img">
<title>WorkBuddySender 功能架构与数据流</title>
<desc>展示全局热键与托盘如何把剪贴板写入收件箱，分析 serve 如何调用 WorkBuddy 模型产出 .md.done，最终在阅读器展示。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="36" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">WorkBuddySender 功能架构与数据流</text>

<g>
  <rect x="120" y="60" width="200" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="220" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">全局热键</text>
  <text x="220" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">ALT+Q · 发送剪贴板</text>
</g>
<g>
  <rect x="360" y="60" width="200" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="460" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">系统托盘菜单</text>
  <text x="460" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">右键图标操作</text>
</g>

<rect x="40" y="140" width="600" height="130" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="164" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">WorkBuddySender.pyw · 发送端运行时</text>
<g>
  <rect x="60" y="178" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="150" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">剪贴板发送</text>
</g>
<g>
  <rect x="255" y="178" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="345" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">托盘图标 + 菜单</text>
</g>
<g>
  <rect x="450" y="178" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="540" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">分析提交</text>
</g>
<g>
  <rect x="255" y="226" width="180" height="36" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="345" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">定时每小时分析</text>
</g>

<rect x="40" y="300" width="275" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="324" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">WorkBuddyInbox/</text>
<text x="60" y="350" font-family="sans-serif" font-size="12" fill="#5F5E5A">.md 待分析文件</text>
<text x="60" y="376" font-family="sans-serif" font-size="12" fill="#5F5E5A">.md.done 已分析</text>
<text x="60" y="402" font-family="sans-serif" font-size="12" fill="#5F5E5A">UTF-8 带 BOM</text>

<rect x="365" y="300" width="275" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="385" y="324" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">分析 serve :8090</text>
<text x="385" y="350" font-family="sans-serif" font-size="12" fill="#5F5E5A">codebuddy --serve</text>
<text x="385" y="376" font-family="sans-serif" font-size="12" fill="#5F5E5A">POST /api/v1/runs</text>
<text x="385" y="402" font-family="sans-serif" font-size="12" fill="#5F5E5A">WorkBuddy 模型执行</text>

<rect x="230" y="450" width="220" height="64" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="476" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">阅读器 :8765</text>
<text x="340" y="498" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">reader.html · 展示分析结果</text>

<line x1="220" y1="108" x2="220" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="108" x2="460" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="160" y1="270" x2="160" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="86" y="290" font-family="sans-serif" font-size="11" fill="#5F5E5A">写入 .md</text>
<line x1="560" y1="270" x2="540" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="496" y="290" font-family="sans-serif" font-size="11" fill="#5F5E5A">提交分析</text>
<line x1="365" y1="360" x2="317" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="324" y="352" font-family="sans-serif" font-size="11" fill="#5F5E5A">写 .md.done</text>
<line x1="177" y1="420" x2="320" y2="448" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="196" y="442" font-family="sans-serif" font-size="11" fill="#5F5E5A">读取展示</text>
</svg>